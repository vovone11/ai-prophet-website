<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AI-прорицатель</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <section class="max-w-4xl mx-auto p-6">
        <h1 class="text-3xl font-bold mb-6">Личный кабинет</h1>
      
        <!-- Статус аккаунта -->
        <div class="bg-indigo-100 border border-indigo-300 rounded-xl p-4 mb-6">
          <p class="text-xl font-semibold text-indigo-800">Подписка: <span class="font-bold">Активна</span></p>
          <p class="text-sm text-indigo-600">Следующее списание: 01.06.2025</p>
        </div>
      
        <!-- История прогнозов -->
        <div class="mb-8">
          <h2 class="text-2xl font-semibold mb-4">История прогнозов</h2>
          <ul class="space-y-4">
            <li class="bg-white shadow rounded-lg p-4">
              <p class="text-gray-800"><strong>27.04.2025:</strong> Вы будете заниматься делом, которое вдохновляет...</p>
            </li>
            <li class="bg-white shadow rounded-lg p-4">
              <p class="text-gray-800"><strong>20.04.2025:</strong> Ваша энергия усилится благодаря новым привычкам...</p>
            </li>
          </ul>
        </div>
      
        <!-- График (заглушка) -->
        <div>
          <h2 class="text-2xl font-semibold mb-4">График прогресса</h2>
          <div class="bg-gray-100 h-64 rounded-lg flex items-center justify-center text-gray-400">
            (Здесь будет график)
          </div>
        </div>
      </section>
</body>
</html>
